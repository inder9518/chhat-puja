<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Photo Album</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

<style>
  body {
    background: #f8f9fa;
    margin: 0;
    font-family: "Poppins", sans-serif;
  }

  header {
    background: linear-gradient(135deg, #4e73df, #1cc88a);
    color: white;
    padding: 20px;
    border-radius: 0 0 40px 40px;
    text-align: center;
  }

  .info-box {
    background: white;
    border-radius: 20px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    padding: 20px;
    margin: 20px auto;
    max-width: 900px;
    text-align: center;
  }

  .photo-card {
    border: none;
    background: transparent;
    text-align: center;
  }

  .photo-card img {
    width: 100%;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.3s ease;
  }

  .photo-card img:hover {
    transform: scale(1.05);
  }

  .photo-title {
    margin-top: 8px;
    font-size: 14px;
  }

  /* Fullscreen Preview */
  .preview-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 9999;
  }

  .preview-overlay img {
    max-width: 90%;
    max-height: 80vh;
    border-radius: 10px;
  }

  .close-btn {
    background: #dc3545;
    color: #fff;
    border: none;
    padding: 10px 25px;
    border-radius: 30px;
    margin-top: 20px;
    cursor: pointer;
    font-weight: 600;
  }

  .close-btn:hover {
    background: #b02a37;
  }
</style>
</head>

<body>

<header>
  <h2>📸 My Photo Album</h2>
</header>

<div class="info-box">
  <h5>Welcome!</h5>
  <p>Click any photo to view it or press <b>Download</b> to save it directly from Google Drive.</p>
</div>

<div class="container">
  <div id="status" class="text-center text-muted mb-3"></div>
  <div id="gallery" class="row g-3"></div>
</div>

<div class="preview-overlay" id="previewOverlay">
  <img id="previewImg" src="" alt="Preview">
  <button class="close-btn" id="closePreview">Close</button>
</div>

<script>
const API_KEY = "AIzaSyA8oxF_zeYV6WM3_qElJ3g5l5_opbJn120";
const FOLDER_ID = "1DSBzdPxdeudDWEpXcvXnn7FwJ8LW4Nc2";
const PAGE_SIZE = 20;

const gallery = document.getElementById("gallery");
const statusEl = document.getElementById("status");
const previewOverlay = document.getElementById("previewOverlay");
const previewImg = document.getElementById("previewImg");
const closePreview = document.getElementById("closePreview");

let nextPageToken = null;

function updateStatus(msg) {
  statusEl.textContent = msg;
}

// Load Photos from Drive
async function listImageFilesInFolder(folderId, pageToken = null) {
  const q = `'${folderId}' in parents and trashed = false and mimeType contains 'image/'`;
  let url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&pageSize=${PAGE_SIZE}&fields=nextPageToken,files(id,name)&key=${API_KEY}`;
  if (pageToken) url += `&pageToken=${pageToken}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error("Drive API request failed");
  const data = await r.json();
  nextPageToken = data.nextPageToken || null;
  return data.files;
}

// Render Photos
function renderFiles(files) {
  files.forEach(f => {
    const col = document.createElement("div");
    col.className = "col-12 col-sm-6 col-md-4 col-lg-3";

    const card = document.createElement("div");
    card.className = "photo-card";

    const img = document.createElement("img");
    img.src = `https://lh3.googleusercontent.com/d/${f.id}=w1000`;
    img.alt = f.name;
    img.addEventListener("click", () => openPreview(f));

    const title = document.createElement("div");
    title.className = "photo-title";
    title.textContent = f.name;

    // Download Button directly from Google Drive
    const dlBtn = document.createElement("a");
    dlBtn.className = "btn btn-sm btn-primary mt-2";
    dlBtn.textContent = "Download";
    dlBtn.href = `https://drive.google.com/uc?export=download&id=${f.id}`;
    dlBtn.setAttribute("download", f.name);

    card.appendChild(img);
    card.appendChild(title);
    card.appendChild(dlBtn);
    col.appendChild(card);
    gallery.appendChild(col);
  });
}

// Open Preview (only Close button)
function openPreview(file) {
  previewImg.src = `https://lh3.googleusercontent.com/d/${file.id}=w2000`;
  previewOverlay.style.display = "flex";
}

closePreview.addEventListener("click", () => {
  previewOverlay.style.display = "none";
  previewImg.src = "";
});

// Load photos initially
async function loadPhotos() {
  try {
    updateStatus("Loading photos...");
    const files = await listImageFilesInFolder(FOLDER_ID, nextPageToken);
    if (!files.length) {
      updateStatus("No photos found.");
      return;
    }
    renderFiles(files);
    updateStatus("");
  } catch (err) {
    console.error(err);
    updateStatus("⚠️ Error loading photos.");
  }
}

loadPhotos();
</script>

</body>
</html>
