<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Page</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Full-screen container */
    .container {
      height: 100vh; /* har screen ke liye full height */
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #000; /* fallback color */
      overflow: hidden;
    }

    /* Image ko full fit karne ke liye */
    .container img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* image stretch nahi hoti, poori fit hoti hai */
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }

    /* Button styling */
    .curve-btn {
      position: relative;
      z-index: 1;
      background: linear-gradient(135deg, #ff8c00, #ff3c00);
      color: #fff;
      text-decoration: none;
      padding: 14px 50px;
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: 600;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
      margin-top: 20px;
    }

    .curve-btn:hover {
      transform: scale(1.07);
      background: linear-gradient(135deg, #ff3c00, #ff8c00);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    /* Responsive text */
    @media (max-width: 768px) {
      .curve-btn {
        font-size: 1rem;
        padding: 12px 40px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 👇 Yahan apni image ka path do -->
    <img src="chhatmata.jpeg" alt="Background Image">
    
    <a href="HOME.HTML" class="curve-btn">Go to Album</a>
  </div>
</body>
</html>
